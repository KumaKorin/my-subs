<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>登录 - Clash 订阅分发中心</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" />
        <link rel="stylesheet" href="./public/css/style.css" />
        <script>
            (function () {
                const savedTheme = localStorage.getItem('theme') || 'dark'
                document.documentElement.setAttribute('data-theme', savedTheme)
            })()
        </script>
    </head>
    <body>
        <div class="auth-container">
            <div class="auth-card">
                <div style="display: flex; justify-content: flex-end; margin-bottom: 0.5rem">
                    <button
                        id="btn-login-theme-toggle"
                        class="btn btn-secondary"
                        style="padding: 0.35rem 0.65rem; font-size: 0.85rem"
                        title="切换明亮/暗黑主题"
                    >
                        <i id="login-theme-icon" class="ri-sun-line"></i>
                    </button>
                </div>
                <h1><i class="ri-flashlight-line"></i> Clash Subs</h1>
                <p>请输入管理员 Token 登录管理面板</p>
                <form id="login-form">
                    <input
                        type="password"
                        id="admin-token-input"
                        class="input-field"
                        placeholder="ADMIN_TOKEN"
                        required
                        autocomplete="current-password"
                    />
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem">登 录</button>
                </form>
            </div>
        </div>

        <script type="module" src="./public/js/login.client.js"></script>
    </body>
</html>
