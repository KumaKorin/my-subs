# 用于下载订阅时指定UA
global-ua: clash.meta

# 全局配置
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true

geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 48
geox-url:
    geoip: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat'
    geosite: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat'
    mmdb: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb'
    asn: 'https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb'

# 控制面板
external-controller: 0.0.0.0:9090
secret: ''
external-ui: ui
external-ui-url: 'https://ghp.ci/https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip'

# 匹配进程 always/strict/off
find-process-mode: strict
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 30

# 策略组选择和fakeip缓存
profile:
    store-selected: true
    store-fake-ip: true

# 流量嗅探
sniffer:
    enable: true
    override-destination: true #  确保全局（包括 TLS/QUIC）都启用目标重写
    sniff:
        HTTP:
            ports: [80, 8080-8880]
            override-destination: true
        TLS:
            ports: [443, 8443]
            override-destination: true #  明确让 443 端口的 HTTPS 流量也支持重写
        QUIC:
            ports: [443, 8443]
            override-destination: true
    force-domain:
        - +.v2ex.com
    skip-domain:
        - 'dlg.io.mi.com'
        - '+.push.apple.com'
        - '+.apple.com'
        - '+.miaofile.com'
        - '+.anya.im'

# 代理模式
tun:
    enable: true
    stack: mixed
    mtu: 1500
    dns-hijack:
        - 'any:53'
        - 'tcp://any:53'
    auto-route: true
    auto-redirect: true
    auto-detect-interface: true

# DNS模块
dns:
    enable: true
    listen: 0.0.0.0:1053
    ipv6: false
    respect-rules: true
    # 模式切换 redir-host / fake-ip
    enhanced-mode: fake-ip
    fake-ip-range: 28.0.0.1/8
    # 模式切换 whitelist/blacklist
    # 黑名单模式表示如果匹配成功则不返回 Fake-IP, 白名单模式时只有匹配成功才返回 Fake-IP
    fake-ip-filter-mode: blacklist
    fake-ip-filter:
        - '*.argotunnel.com'
        - '*.cfargotunnel.com'
        - 'update.argotunnel.com'
        - '+.lan'
        - '+.local'
        - geosite:private
        - geosite:cn
    default-nameserver:
        - 223.5.5.5
        - 119.29.29.29
    proxy-server-nameserver:
        - 223.5.5.5
        - 119.29.29.29
    nameserver:
        - 223.5.5.5
        - 119.29.29.29
    nameserver-policy:
        'rule-set:geolocation-!cn':
            - 'https://dns.cloudflare.com/dns-query'
            - 'https://dns.google/dns-query'

proxies:
    - name: '➡️ Direct'
      type: direct
      udp: true

# 锚点：通用应用策略组继承
pr:
    &pr {
        type: select,
        proxies:
            [
                👉 节点选择,
                ♻️ 自动选择,
                🇭🇰 自动选择,
                🇹🇼 自动选择,
                🇯🇵 自动选择,
                🇸🇬 自动选择,
                🇺🇸 自动选择,
                🇸🇬 原生自动,
                🇺🇸 原生自动,
                🇭🇰 香港节点,
                🇹🇼 台湾节点,
                🇯🇵 日本节点,
                🇸🇬 新加坡节点,
                🇺🇸 美国节点,
                🌐 全部节点,
                ➡️ Direct
            ]
    }

# 策略组
proxy-groups:
    - {
          name: 👉 节点选择,
          type: select,
          proxies:
              [
                  ♻️ 自动选择,
                  🇭🇰 自动选择,
                  🇹🇼 自动选择,
                  🇯🇵 自动选择,
                  🇸🇬 自动选择,
                  🇺🇸 自动选择,
                  🇸🇬 原生自动,
                  🇺🇸 原生自动,
                  🇭🇰 香港节点,
                  🇹🇼 台湾节点,
                  🇯🇵 日本节点,
                  🇸🇬 新加坡节点,
                  🇺🇸 美国节点,
                  🌐 全部节点,
                  ➡️ Direct
              ]
      }

    - { name: 🌐 全部节点, type: select, include-all: true }
    - {
          name: ♻️ 自动选择,
          type: url-test,
          include-all: true,
          url: 'https://www.gstatic.com/generate_204',
          interval: 300,
          tolerance: 50,
          lazy: true,
          filter: '^(?!.*(直连|官网|流量|到期|剩余|重置)).*$'
      }

    - {
          name: 🇭🇰 自动选择,
          type: url-test,
          include-all: true,
          url: 'https://www.gstatic.com/generate_204',
          interval: 300,
          tolerance: 50,
          lazy: true,
          filter: '(?i)港|hk|hongkong|hong kong'
      }
    - {
          name: 🇹🇼 自动选择,
          type: url-test,
          include-all: true,
          url: 'https://www.gstatic.com/generate_204',
          interval: 300,
          tolerance: 50,
          lazy: true,
          filter: '(?i)台|tw|taiwan|tai wan'
      }
    - {
          name: 🇯🇵 自动选择,
          type: url-test,
          include-all: true,
          url: 'https://www.gstatic.com/generate_204',
          interval: 300,
          tolerance: 50,
          lazy: true,
          filter: '(?i)日|jp|japan'
      }
    - {
          name: 🇸🇬 自动选择,
          type: url-test,
          include-all: true,
          url: 'https://www.gstatic.com/generate_204',
          interval: 300,
          tolerance: 50,
          lazy: true,
          filter: '(?i)新|sg|singapore'
      }
    - {
          name: 🇺🇸 自动选择,
          type: url-test,
          include-all: true,
          url: 'https://www.gstatic.com/generate_204',
          interval: 300,
          tolerance: 50,
          lazy: true,
          filter: '(?i)美|us|united states|america'
      }

    - {
          name: 🇸🇬 原生自动,
          type: url-test,
          include-all: true,
          url: 'https://www.gstatic.com/generate_204',
          interval: 300,
          tolerance: 50,
          lazy: true,
          filter: '(?i)(?=.*(新|SG|SGP|Singapore))(?=.*(原生|Native))'
      }
    - {
          name: 🇺🇸 原生自动,
          type: url-test,
          include-all: true,
          url: 'https://www.gstatic.com/generate_204',
          interval: 300,
          tolerance: 50,
          lazy: true,
          filter: '(?i)(?=.*(美|US|States|America))(?=.*(原生|Native))'
      }

    - { name: 🇭🇰 香港节点, type: select, include-all: true, filter: '(?i)港|hk|hongkong|hong kong' }
    - { name: 🇹🇼 台湾节点, type: select, include-all: true, filter: '(?i)台|tw|taiwan|tai wan' }
    - { name: 🇯🇵 日本节点, type: select, include-all: true, filter: '(?i)日|jp|japan' }
    - { name: 🇸🇬 新加坡节点, type: select, include-all: true, filter: '(?i)新|sg|singapore' }
    - { name: 🇺🇸 美国节点, type: select, include-all: true, filter: '(?i)美|us|united states|america' }

    # === 继承锚点的应用分组 ===
    - { name: 📹 YouTube, !!merge <<: *pr }
    - { name: 🍀 Google, !!merge <<: *pr }
    - { name: 🤖 人工智能, !!merge <<: *pr }
    - { name: 👨🏿‍💻 GitHub, !!merge <<: *pr }
    - { name: 🐬 OneDrive, !!merge <<: *pr }
    - { name: 🪟 Microsoft, !!merge <<: *pr }
    - { name: 🧱 Adobe, !!merge <<: *pr }
    - {
          name: 🎵 TikTok,
          type: select,
          proxies:
              [
                  🇸🇬 自动选择,
                  🇯🇵 自动选择,
                  🇺🇸 自动选择,
                  🇹🇼 自动选择,
                  🇸🇬 原生自动,
                  🇺🇸 原生自动,
                  🇸🇬 新加坡节点,
                  🇯🇵 日本节点,
                  🇺🇸 美国节点,
                  🇹🇼 台湾节点,
                  👉 节点选择,
                  ➡️ Direct
              ]
      }
    - { name: 📲 Telegram, !!merge <<: *pr }
    - { name: 🎥 NETFLIX, !!merge <<: *pr }
    - { name: ✈️ Speedtest, !!merge <<: *pr }
    - { name: 💶 PayPal, !!merge <<: *pr }
    - { name: 🍎 Apple, type: select, proxies: [➡️ Direct, 👉 节点选择] }
    - { name: 🎯 规则直连, type: select, proxies: [➡️ Direct, 👉 节点选择] }
    - { name: 🐟 漏网之鱼, !!merge <<: *pr }
rules:
    - DST-PORT,22,➡️ Direct
    - RULE-SET,private_domain,➡️ Direct

    # Steam 下载服务器直连
    - DOMAIN-SUFFIX,steamcontent.com,➡️ Direct
    - DOMAIN-SUFFIX,steamcdn-a.akamaihd.net,➡️ Direct
    - DOMAIN-SUFFIX,cdn.ubi.com,➡️ Direct
    - DOMAIN-SUFFIX,visage.surgeplay.com,➡️ Direct

    #- IP-CIDR6,::/0
    - RULE-SET,apple_domain,🍎 Apple
    - RULE-SET,ai,🤖 人工智能
    - RULE-SET,github_domain,👨🏿‍💻 GitHub
    - RULE-SET,youtube_domain,📹 YouTube
    - RULE-SET,google_domain,🍀 Google
    - RULE-SET,onedrive_domain,🐬 OneDrive
    - RULE-SET,microsoft_domain,🪟 Microsoft
    - RULE-SET,tiktok_domain,🎵 TikTok
    - RULE-SET,speedtest_domain,✈️ Speedtest
    - RULE-SET,telegram_domain,📲 Telegram
    - RULE-SET,netflix_domain,🎥 NETFLIX
    - RULE-SET,paypal_domain,💶 PayPal
    - RULE-SET,adobe_domain,🧱 Adobe
    - RULE-SET,geolocation-!cn,👉 节点选择
    - RULE-SET,cn_domain,🎯 规则直连
    - RULE-SET,google_ip,🍀 Google,no-resolve
    - RULE-SET,netflix_ip,🎥 NETFLIX,no-resolve
    - RULE-SET,telegram_ip,📲 Telegram,no-resolve
    - RULE-SET,cn_ip,🎯 规则直连
    - MATCH,🐟 漏网之鱼

rule-anchor:
    ip: &ip { type: http, interval: 86400, behavior: ipcidr, format: mrs }
    domain: &domain { type: http, interval: 86400, behavior: domain, format: mrs }
    qcy: &qcy { type: http, interval: 86400, behavior: domain, format: text }
    class: &class { type: http, interval: 86400, behavior: classical, format: text }
